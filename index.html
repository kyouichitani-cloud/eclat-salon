<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <style>html,body{margin:0;background:#080808}#root{min-height:100svh;background:#080808}</style>
  <title>ÉCLAT（エクラ）｜大阪のプライベートヘアサロン</title>
  <meta name="description" content="美しさに、静かな余韻を。髪質・骨格・ライフスタイルに寄り添う架空の高級美容室ÉCLATのデモサイト。"/>
  <meta name="theme-color" content="#111111"/>
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="ÉCLAT｜美しさに、静かな余韻を。"/>
  <meta property="og:description" content="上質なプライベートヘアサロンのデモサイト。"/>
  <meta property="og:image" content="images/hero.jpg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=optional" media="(max-width:767px)" onload="this.onload=null;this.rel='stylesheet'"/>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" media="(min-width:768px)" onload="this.onload=null;this.rel='stylesheet'"/>
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap"/></noscript>
  <link rel="preload" as="image" href="images/mobile/hero.jpg" media="(max-width:767px)" fetchpriority="high"/>
  <link rel="preload" as="image" href="images/hero.jpg" media="(min-width:768px)" fetchpriority="high"/>
  <style>
    .opening{position:fixed;inset:0;z-index:9999;width:100vw;height:100dvh;overflow:clip;contain:strict;isolation:isolate;background:#080808;color:#fff;pointer-events:none;animation:opening-hide .1s 2.77s both}
    .opening__panel{position:fixed;right:0;left:0;background:#080808;will-change:transform;backface-visibility:hidden;animation-duration:.8s;animation-delay:1.97s;animation-fill-mode:both;animation-timing-function:cubic-bezier(.77,0,.18,1)}
    .opening__panel--top{top:0;bottom:50%;animation-name:opening-top}.opening__panel--bottom{top:50%;bottom:0;animation-name:opening-bottom}
    .opening__content{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;will-change:opacity;animation:opening-content-out .2s 2.57s both}
    .opening__eyebrow{font:300 9px/1.9 -apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;letter-spacing:.42em;animation:opening-fade-up .35s both}
    .opening__letter{display:flex;overflow:hidden;font:300 clamp(76px,12vw,170px)/1 Georgia,'Times New Roman','Yu Mincho',serif;letter-spacing:.12em}
    .opening__letter span{display:block;transform:translateY(110%);animation:opening-letter .65s calc(.25s + var(--letter) * .08s) cubic-bezier(.22,1,.36,1) forwards}
    .opening__line{width:min(420px,70vw);height:1px;margin:19px auto 22px;background:#b89b67;transform:scaleX(0);animation:opening-line .55s .97s cubic-bezier(.45,0,.55,1) forwards}
    .opening__tagline{font-family:Georgia,'Times New Roman','Yu Mincho',serif;letter-spacing:.14em;animation:opening-fade-up .45s 1.37s both}
    @keyframes opening-fade-up{from{opacity:0;transform:translate3d(0,12px,0)}to{opacity:1;transform:translate3d(0,0,0)}}@keyframes opening-letter{from{transform:translate3d(0,110%,0)}to{transform:translate3d(0,0,0)}}@keyframes opening-line{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes opening-top{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,-100%,0)}}@keyframes opening-bottom{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,100%,0)}}@keyframes opening-content-out{from{opacity:1}to{opacity:0}}@keyframes opening-hide{from{visibility:visible;opacity:1}to{visibility:hidden;opacity:0}}
    @media(max-width:767px){.opening{animation-duration:.06s;animation-delay:1.02s}.opening__panel{animation-duration:.38s;animation-delay:.64s}.opening__content{animation-duration:.12s;animation-delay:.88s}.opening__eyebrow{animation-duration:.16s}.opening__letter span{animation-duration:.28s;animation-delay:calc(.08s + var(--letter) * .035s)}.opening__line{animation-duration:.25s;animation-delay:.38s}.opening__tagline{animation-duration:.22s;animation-delay:.52s}}
    @media(prefers-reduced-motion:reduce){.opening{display:none}}
  </style>
</head>
<body>
  <div class="opening" role="status" aria-label="サイトを読み込んでいます">
    <div class="opening__panel opening__panel--top"></div><div class="opening__panel opening__panel--bottom"></div>
    <div class="opening__content"><p class="opening__eyebrow">PRIVATE HAIR SALON</p><div class="opening__letter" aria-label="ÉCLAT"><span style="--letter:0">É</span><span style="--letter:1">C</span><span style="--letter:2">L</span><span style="--letter:3">A</span><span style="--letter:4">T</span></div><div class="opening__line"></div><p class="opening__tagline">美しさに、静かな余韻を。</p></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
